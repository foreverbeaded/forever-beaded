<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forever Beaded Order Management</title>
  <link rel="stylesheet" href="/admin-assets/orders.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Forever Beaded Owner Tools</p>
      <h1>Order Management</h1>
      <p>Track payment separately from handmade progress. Check RBC independently before marking an order Paid.</p>
    </header>

    <form id="accessForm" class="panel">
      <label for="adminSecret">Admin secret</label>
      <input id="adminSecret" type="password" autocomplete="current-password" required>
      <label for="paymentStatusFilter">Payment status</label>
      <select id="paymentStatusFilter">
        <option value="AWAITING_PAYMENT">Awaiting Payment</option>
        <option value="VERIFIED">Paid</option>
        <option value="CANCELLED">Cancelled</option>
        <option value="ALL">All payment states</option>
      </select>
      <button type="submit">Load Orders</button>
    </form>

    <aside id="activationNotice" class="activation-notice" hidden></aside>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="orderList" aria-live="polite" aria-label="Private order results"></section>
  </main>
  <script src="/admin-assets/orders.js" defer></script>
</body>
</html>
