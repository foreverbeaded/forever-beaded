<script>
history.scrollRestoration='manual';window.addEventListener('load',()=>window.scrollTo(0,0),{once:true});(()=>{const form=document.getElementById('sweetSearchForm'),input=document.getElementById('sweetSearch'),cards=Array.from(document.querySelectorAll('.product-grid .product-card')),empty=document.getElementById('productEmpty'),keyName='foreverBeadedFavourites';function load(){try{const saved=JSON.parse(localStorage.getItem(keyName)||'[]');return new Set(Array.isArray(saved)?saved.map(String):[])}catch{return new Set}}function sync(){const favourites=load();cards.forEach(card=>{const button=card.querySelector('.favourite-btn'),selected=favourites.has(card.dataset.favouriteKey);button.classList.toggle('is-saved',selected);button.setAttribute('aria-pressed',String(selected));button.setAttribute('aria-label',`${selected?'Remove':'Save'} Ice Cream Keychain ${selected?'from':'to'} favourites`);button.querySelector('span').textContent=selected?'\u2665':'\u2661'})}cards.forEach(card=>card.querySelector('.favourite-btn').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();const favourites=load(),key=card.dataset.favouriteKey;if(favourites.has(key))favourites.delete(key);else favourites.add(key);localStorage.setItem(keyName,JSON.stringify([...favourites]));sync()}));function filter(){const query=input.value.trim().toLowerCase(),matches=cards.filter(card=>card.textContent.trim().toLowerCase().includes(query));cards.forEach(card=>{card.hidden=!matches.includes(card)});empty.hidden=matches.length>0}input.addEventListener('input',filter);form.addEventListener('submit',event=>{event.preventDefault();filter()});sync()})();
</script>
